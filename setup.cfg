[develop]
script_dir=$base/lib/turtle_driver
[install]
install_scripts=$base/lib/turtle_driver

[tool:pytest]
markers =
    linter: the L0 tier - the coding style of the package
    node: the L2 tier - one framework node driven through the ROS2 objects it declares
    unit: the L1 tier - the hsm-turtle editor plugin, its descriptor and its adapter
timeout = 60
